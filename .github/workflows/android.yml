name: Build QueueWatch

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/persistent-background-tracking
      - feature/forecast-experiment
      - feature/forecast-pilot-20260924

env:
  PLAY_KEYSTORE_B64: ${{ secrets.QUEUEWATCH_KEYSTORE_BASE64 }}
  PLAY_KEYSTORE_PASSWORD: ${{ secrets.QUEUEWATCH_KEYSTORE_PASSWORD }}
  PLAY_KEY_ALIAS: ${{ secrets.QUEUEWATCH_KEY_ALIAS }}
  PLAY_KEY_PASSWORD: ${{ secrets.QUEUEWATCH_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install fixed debug signing key
        run: base64 -d tools/queuewatch-debug.keystore.b64 > tools/queuewatch-debug.keystore

      - name: Verify shipped fixes are materialized
        run: python3 tools/verify_materialized_fixes.py

      - name: Verify Forecast flavor configuration
        run: python3 tools/verify_forecast_flavors.py

      - name: Check archive replay and ingestion validation
        run: |
          python3 -m unittest analysis.forecast_v1.test_backtest -v
          node backend/submit-queuewatch-forecast/validation.test.ts

      - name: Run stable and Forecast unit tests
        run: gradle testStableDebugUnitTest testForecastDebugUnitTest

      - name: Build stable and Forecast debug APKs
        run: gradle assembleStableDebug assembleForecastDebug

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-stable-debug
          path: app/build/outputs/apk/stable/debug/app-stable-debug.apk

      - name: Upload Forecast APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-Forecast-debug
          path: app/build/outputs/apk/forecast/debug/app-forecast-debug.apk

      - name: Install Google Play upload key
        if: ${{ env.PLAY_KEYSTORE_B64 != '' }}
        run: echo "$PLAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/queuewatch-upload.jks"

      - name: Build signed Google Play stable AAB
        if: ${{ env.PLAY_KEYSTORE_B64 != '' }}
        env:
          QUEUEWATCH_KEYSTORE_PATH: ${{ runner.temp }}/queuewatch-upload.jks
          QUEUEWATCH_KEYSTORE_PASSWORD: ${{ env.PLAY_KEYSTORE_PASSWORD }}
          QUEUEWATCH_KEY_ALIAS: ${{ env.PLAY_KEY_ALIAS }}
          QUEUEWATCH_KEY_PASSWORD: ${{ env.PLAY_KEY_PASSWORD }}
        run: gradle bundleStableRelease

      - name: Upload Google Play stable AAB
        if: ${{ env.PLAY_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-GooglePlay-AAB
          path: app/build/outputs/bundle/stableRelease/app-stable-release.aab
