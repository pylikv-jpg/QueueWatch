name: Build QueueWatch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install fixed debug signing key
        run: |
          base64 -d tools/queuewatch-debug.keystore.b64 > tools/queuewatch-debug.keystore
          keytool -list -v \
            -keystore tools/queuewatch-debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:'

      - name: Apply vehicle type queue count fix
        run: python3 tools/apply_queue_type_count_fix.py

      - name: Apply swipe and back navigation fix
        run: python3 tools/apply_swipe_navigation_fix.py

      - name: Apply progress-to-call fix
        run: python3 tools/apply_call_progress_fix.py

      - name: Apply queue movement information
        run: python3 tools/apply_queue_movement_info.py

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          KEY_FP="$(keytool -list -v -keystore tools/queuewatch-debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_FP="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "KEY_SHA256=$KEY_FP"
          echo "APK_SHA256=$APK_FP"
          test -n "$KEY_FP"
          test "$KEY_FP" = "$APK_FP"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
