name: Build QueueWatch

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PLAY_KEYSTORE_B64: ${{ secrets.QUEUEWATCH_KEYSTORE_BASE64 }}
  PLAY_KEYSTORE_PASSWORD: ${{ secrets.QUEUEWATCH_KEYSTORE_PASSWORD }}
  PLAY_KEY_ALIAS: ${{ secrets.QUEUEWATCH_KEY_ALIAS }}
  PLAY_KEY_PASSWORD: ${{ secrets.QUEUEWATCH_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install fixed debug signing key
        run: base64 -d tools/queuewatch-debug.keystore.b64 > tools/queuewatch-debug.keystore

      - name: Apply vehicle type queue count fix
        run: python3 tools/apply_queue_type_count_fix.py

      - name: Apply swipe and back navigation fix
        run: python3 tools/apply_swipe_navigation_fix.py

      - name: Apply progress-to-call fix
        run: python3 tools/apply_call_progress_fix.py

      - name: Apply queue movement information
        run: python3 tools/apply_queue_movement_info.py

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Install Google Play upload key
        if: ${{ env.PLAY_KEYSTORE_B64 != '' }}
        run: echo "$PLAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/queuewatch-upload.jks"

      - name: Build signed Google Play AAB
        if: ${{ env.PLAY_KEYSTORE_B64 != '' }}
        env:
          QUEUEWATCH_KEYSTORE_PATH: ${{ runner.temp }}/queuewatch-upload.jks
          QUEUEWATCH_KEYSTORE_PASSWORD: ${{ env.PLAY_KEYSTORE_PASSWORD }}
          QUEUEWATCH_KEY_ALIAS: ${{ env.PLAY_KEY_ALIAS }}
          QUEUEWATCH_KEY_PASSWORD: ${{ env.PLAY_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Upload Google Play AAB
        if: ${{ env.PLAY_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
