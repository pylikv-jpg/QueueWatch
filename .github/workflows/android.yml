name: Build QueueWatch

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install fixed debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d tools/queuewatch-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep 'SHA256:'

      - name: Apply vehicle type queue count fix
        run: python3 tools/apply_queue_type_count_fix.py

      - name: Apply swipe and back navigation fix
        run: python3 tools/apply_swipe_navigation_fix.py

      - name: Apply progress-to-call fix
        run: python3 tools/apply_call_progress_fix.py

      - name: Apply queue movement information
        run: python3 tools/apply_queue_movement_info.py

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QueueWatch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
