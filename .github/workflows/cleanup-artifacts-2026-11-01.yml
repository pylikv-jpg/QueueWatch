          assert repo == manifest["repository"], "Repository mismatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/maintenance/cleanup-actions-2026-11-01", "Branch mismatch"
          base = "https://api.github.com/repos/" + repo + "/actions/artifacts"
          def request(method, url):
              req = urllib.request.Request(url, method=method, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None
          def inventory():
              result = {}
              page = 1
              while True:
                  data = request("GET", base + "?per_page=100&page=" + str(page))
                  artifacts = data["artifacts"]
                  result.update({a["id"]: a for a in artifacts})
                  if len(artifacts) < 100:
                      return result
                  page += 1
          before = inventory()
          keep_ids = {a["id"] for a in manifest["keep"]}
          delete_ids = {a["id"] for a in manifest["remove"]}
          assert not (keep_ids & delete_ids), "Overlapping manifest"
          assert len(delete_ids) == len(manifest["remove"]), "Duplicate deletion IDs"
          for item in manifest["keep"]:
              actual = before.get(item["id"])
              assert actual and not actual["expired"], "Required retained artifact missing"
              assert actual["name"] == item["name"] and actual["size_in_bytes"] == item["size_in_bytes"], "Retained artifact mismatch"
          for item in manifest["remove"]:
              actual = before.get(item["id"])
              if actual:
                  assert actual["name"] == item["name"] and actual["size_in_bytes"] == item["size_in_bytes"], "Deletion manifest mismatch"
          deleted = 0
          freed_bytes = 0
          for item in manifest["remove"]:
              actual = before.get(item["id"])
              if not actual:
                  continue
              try:
                  request("DELETE", base + "/" + str(item["id"]))
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      continue
                  raise
              deleted += 1
              freed_bytes += actual["size_in_bytes"]
              print("Deleted artifact", item["id"], item["name"], actual["size_in_bytes"], flush=True)
          after = inventory()
          assert not (delete_ids & after.keys()), "Some selected artifacts remain"
          assert keep_ids <= after.keys(), "A retained artifact is missing"
          active = [a for a in after.values() if not a["expired"]]
          result = {"repository": repo, "deleted_artifacts": deleted, "freed_bytes": freed_bytes, "remaining_artifacts": len(active), "remaining_bytes": sum(a["size_in_bytes"] for a in active), "all_retained_artifacts_verified": True}
          print(json.dumps(result), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("# One-time artifact cleanup\n\n```json\n" + json.dumps(result, indent=2) + "\n```\n")
